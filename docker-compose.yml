services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      - PORT=3000
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-cabscodepro@gmail.com}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - PAID_AUDIT_SECRET=${PAID_AUDIT_SECRET}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - AUDIT_USAGE_PATH=${AUDIT_USAGE_PATH}
      - JOURNAL_PUBLISH_PASSWORD=${JOURNAL_PUBLISH_PASSWORD}
      - JOURNAL_DATA_DIR=/app/data
    volumes:
      - journal-data:/app/data

    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  journal-data:
